services:
  api:
    build: .
    container_name: indexador-api
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 9100
    ports:
      - "9102:9100"
    env_file:
      - .env
    environment:
      # Nao calcular SHA-256 do conteudo em montagem de rede (leria tudo via CIFS,
      # horas de trafego). Esses arquivos ficam com content_hash vazio.
      - HASH_SKIP_PREFIXES=_winmkt
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - /mnt/share/:/data/indexados
      # Servidor de midias .78 (CIFS, ja montado no host em /mnt/winmkt).
      # ':ro' garante que nada no Noxis consiga escrever/apagar la.
      - /mnt/winmkt:/data/indexados/_winmkt:ro
    restart: unless-stopped

  indexer:
    build: .
    container_name: indexador-worker
    command: /app/scripts/run_indexer.sh
    env_file:
      - .env
    environment:
      # Nao calcular SHA-256 do conteudo em montagem de rede (leria tudo via CIFS,
      # horas de trafego). Esses arquivos ficam com content_hash vazio.
      - HASH_SKIP_PREFIXES=_winmkt
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - /mnt/share/:/data/indexados
      # Servidor de midias .78 (CIFS, ja montado no host em /mnt/winmkt).
      # ':ro' garante que nada no Noxis consiga escrever/apagar la.
      - /mnt/winmkt:/data/indexados/_winmkt:ro
    restart: unless-stopped