<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title or "Indexador • Amigos do Bem" }}</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/img/favicon-16x16.png">
</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="/static/img/Novo-LOGO-01.png" alt="Amigos do Bem">
        </div>

        <nav class="sidebar-nav">

            <a href="/"
               class="{% if request.url.path in ['/', '/search'] %}active{% endif %}">
                <i class="bi bi-search"></i>
                <span>Buscar Arquivos</span>
            </a>

            <a href="/status"
               class="{% if request.url.path == '/status' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Status Sistema</span>
            </a>

            <a href="/health"
               class="{% if request.url.path == '/health' %}active{% endif %}">
                <i class="bi bi-heart-pulse"></i>
                <span>Healthcheck</span>
            </a>

        </nav>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

</div>

<!-- MODAL PREVIEW -->
<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="previewTitle"></h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body text-center"
                 id="previewBody"
                 style="min-height:400px;">
            </div>

        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast">
    Copiado
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function previewFile(url, ext, name) {
        const modalEl = document.getElementById("previewModal");
        const body = document.getElementById("previewBody");
        const title = document.getElementById("previewTitle");

        // Reset de estado inicial
        title.textContent = name;
        body.innerHTML = '<div class="text-center p-4"><span class="spinner-border text-primary"></span><p>Carregando...</p></div>';

        let cleanExt = (ext || "")
            .toLowerCase()
            .split("?")[0]
            .replace(".", "")
            .trim();

        /* Helper para limpar e adicionar conteúdo */
        const setContent = (el) => {
            body.innerHTML = "";
            body.appendChild(el);
        };

        /* IMAGEM */
        if (["jpg", "jpeg", "png", "webp", "gif", "svg"].includes(cleanExt)) {
            const img = document.createElement("img");
            img.src = url;
            img.className = "img-fluid rounded-3 shadow-sm";
            img.style.maxHeight = "75vh";
            img.onload = () => setContent(img);
        }

        /* VÍDEO */
        else if (["mp4", "webm"].includes(cleanExt)) {
            const video = document.createElement("video");
            video.src = url;
            video.controls = true;
            video.autoplay = true;
            video.className = "w-100 rounded-3";
            setContent(video);
        }

        /* PDF */
        else if (cleanExt === "pdf") {
            const iframe = document.createElement("iframe");
            // Adicionamos #toolbar=0 para uma visualização mais limpa
            iframe.src = `${url}#view=FitH`;
            iframe.style.width = "100%";
            iframe.style.height = "75vh";
            iframe.style.border = "none";
            setContent(iframe);
        }

        /* TEXTO SEGURO */
        else if (["txt", "log", "json", "csv", "py", "js", "html", "css"].includes(cleanExt)) {
            fetch(url)
                .then(r => {
                    if (!r.ok) throw new Error();
                    return r.text();
                })
                .then(text => {
                    const pre = document.createElement("pre");
                    pre.textContent = text;
                    pre.className = "text-start p-3 rounded-3 shadow-inner";
                    pre.style.cssText = "white-space: pre-wrap; background: #1e293b; color: #f1f5f9; max-height: 70vh; overflow: auto; font-family: 'Fira Code', monospace; font-size: 0.9rem;";
                    setContent(pre);
                })
                .catch(() => {
                    body.innerHTML = '<div class="alert alert-danger">Não foi possível ler o conteúdo do arquivo.</div>';
                });
        }

        /* NÃO SUPORTADO */
        else {
            body.innerHTML = `
            <div class="text-center p-5">
                <i class="bi bi-file-earmark-code mb-3" style="font-size: 3rem; color: #64748b;"></i>
                <p class="mb-4">Pré-visualização não disponível para arquivos <strong>.${cleanExt}</strong></p>
                <a href="${url}" download="${name}" class="btn btn-primary px-4">
                    <i class="bi bi-download me-2"></i>Baixar Arquivo
                </a>
            </div>`;
        }

        // Iniciar Modal do Bootstrap
        const modal = new bootstrap.Modal(modalEl);
        modal.show();

        // Evento para parar vídeos ao fechar o modal
        modalEl.addEventListener('hidden.bs.modal', () => {
            body.innerHTML = "";
        }, {once: true});
    }


    /* TOAST */
    function showToast(text) {
        const toast = document.getElementById("toast");
        toast.innerText = text;
        toast.classList.add("show");

        setTimeout(() => toast.classList.remove("show"), 2500);
    }
</script>

</body>
</html>
