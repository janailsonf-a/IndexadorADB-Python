<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title or "Indexador • Amigos do Bem" }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/img/favicon-16x16.png">
</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="/static/img/Novo-LOGO-01.png" alt="Amigos do Bem">
        </div>

        <nav class="sidebar-nav">

            <a href="/"
               class="{% if request.url.path in ['/', '/search'] %}active{% endif %}">
                <i class="bi bi-search"></i>
                <span>Buscar Arquivos</span>
            </a>

            <a href="/status"
               class="{% if request.url.path == '/status' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                <span>Status Sistema</span>
            </a>

            <a href="/health"
               class="{% if request.url.path == '/health' %}active{% endif %}">
                <i class="bi bi-heart-pulse"></i>
                <span>Healthcheck</span>
            </a>

        </nav>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

</div>

<!-- MODAL PREVIEW -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="previewTitle"></h5>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body text-center"
           id="previewBody"
           style="min-height:400px;">
      </div>

    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast">
    Copiado
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function previewFile(url, ext, name) {
    const modalEl = document.getElementById("previewModal");
    const body = document.getElementById("previewBody");
    const title = document.getElementById("previewTitle");

    title.textContent = name;
    body.innerHTML = "";

    let cleanExt = (ext || "")
        .toLowerCase()
        .split("?")[0]
        .replace(".", "")
        .trim();

    /* IMAGEM */
    if (["jpg", "jpeg", "png", "webp", "gif", "svg"].includes(cleanExt)) {
        const img = document.createElement("img");
        img.src = url;
        img.alt = name;
        img.style.maxWidth = "100%";
        img.style.maxHeight = "75vh";
        img.style.borderRadius = "12px";
        body.appendChild(img);
    }

    /* VÍDEO */
    else if (["mp4", "webm"].includes(cleanExt)) {
        const video = document.createElement("video");
        video.src = url;
        video.controls = true;
        video.style.width = "100%";
        video.style.borderRadius = "12px";
        body.appendChild(video);
    }

    /* PDF */
    else if (cleanExt === "pdf") {
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.style.width = "100%";
        iframe.style.height = "75vh";
        iframe.style.border = "none";
        body.appendChild(iframe);
    }

    /* TEXTO SEGURO */
    else if (["txt", "log", "json", "csv"].includes(cleanExt)) {

        fetch(url)
            .then(r => {
                if (!r.ok) throw new Error("Erro ao carregar");
                return r.text();
            })
            .then(text => {

                const pre = document.createElement("pre");
                pre.textContent = text; // 🔐 SEGURO CONTRA XSS

                pre.style.textAlign = "left";
                pre.style.whiteSpace = "pre-wrap";
                pre.style.background = "#0f172a";
                pre.style.color = "#e5e7eb";
                pre.style.padding = "16px";
                pre.style.borderRadius = "12px";
                pre.style.maxHeight = "70vh";
                pre.style.overflow = "auto";

                body.appendChild(pre);
            })
            .catch(() => {
                body.innerHTML = "<p>Erro ao carregar o arquivo.</p>";
            });
    }

    /* NÃO SUPORTADO */
    else {
        const container = document.createElement("div");
        container.style.padding = "40px";

        const p = document.createElement("p");
        p.textContent = "Pré-visualização não suportada.";

        const btn = document.createElement("a");
        btn.href = url;
        btn.download = name;
        btn.className = "btn btn-primary";
        btn.textContent = "Baixar arquivo";

        container.appendChild(p);
        container.appendChild(btn);
        body.appendChild(container);
    }

    new bootstrap.Modal(modalEl).show();
}

/* COPIAR CAMINHO */
function copyPath(path){
    if(!path) return;

    navigator.clipboard.writeText(path)
        .then(() => showToast("Caminho copiado para a área de transferência"))
        .catch(() => alert("Não foi possível copiar o caminho"));
}

/* TOAST */
function showToast(text){
    const toast = document.getElementById("toast");
    toast.innerText = text;
    toast.classList.add("show");

    setTimeout(() => toast.classList.remove("show"), 2500);
}
</script>

</body>
</html>
